<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      My Discord Server
    </title>
    <style>
      :root{
      --bg:#0f1720;
      --card:#0b1220;
      --accent:#6ee7b7;
      --text:#e6eef8;
      --muted:#9fb4c8;
      --glass: rgba(255,255,255,0.03);
      }
      *{box-sizing:border-box}
      body{
      margin:0;
      font-family: Inter, "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP";
      background: linear-gradient(180deg, #07101a 0%, #0b1a26 100%);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      }

      .container{
      width:100%;
      max-width:960px;
      display:grid;
      grid-template-columns: 1fr 380px;
      gap:24px;
      align-items:start;
      }

      .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:12px;
      padding:20px;
      box-shadow: 0 6px 18px rgba(2,6,23,0.6);
      border: 1px solid rgba(255,255,255,0.03);
      }

      .hero {
      padding:28px;
      display:flex;
      gap:18px;
      align-items:center;
      }
      .logo{
      width:72px;
      height:72px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--accent),#3b82f6);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      font-size:22px;
      color:#021018;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5), inset 0 -6px 14px rgba(255,255,255,0.02);
      }
      h1{
      margin:0;
      font-size:20px;
      }
      p.lead{
      margin:6px 0 0 0;
      color:var(--muted);
      font-size:14px;
      }

      .desc{
      margin-top:12px;
      color:var(--muted);
      line-height:1.6;
      font-size:14px;
      }

      .buttons{
      margin-top:16px;
      display:flex;
      gap:10px;
      }
      .btn{
      padding:10px 14px;
      border-radius:10px;
      font-weight:600;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      gap:8px;
      align-items:center;
      border:1px solid rgba(255,255,255,0.04);
      background:var(--glass);
      color:var(--text);
      }
      .btn.primary{
      background: linear-gradient(90deg,var(--accent),#60a5fa);
      color:#021018;
      border:none;
      }

      /* Widget column */
      .widget-wrap{
      display:flex;
      flex-direction:column;
      gap:12px;
      }
      .widget-card{
      padding:12px;
      border-radius:10px;
      background: linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.025);
      min-height:520px;
      display:flex;
      flex-direction:column;
      }
      .widget-card .title{
      font-size:13px;
      color:var(--muted);
      margin-bottom:8px;
      }
      /* iframe styles */
      iframe.discord-widget{
      width:100%;
      height:460px;
      border-radius:8px;
      border:0;
      background:transparent;
      flex:1 1 auto;
      overflow:hidden;
      }

      /* Responsive */
      @media (max-width:880px){
      .container{ grid-template-columns: 1fr; }
      .widget-card{ min-height:380px; }
      iframe.discord-widget{ height:360px; }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="card">
        <div class="hero">
          <div class="logo">
            DC
          </div>
          <div>
            <h1>
              LunaNya
            </h1>
            <p class="lead">
              Discordサーバーへようこそ!
            </p>
          </div>
        </div>
        <div class="desc">
          lunanya公式discordチャンネルに参加できます
          <br>
          下のボタンからサーバーに参加できます
        </div>
        <div class="buttons">
          <a class="btn primary" href="https://discord.gg/gYYr4H6x" target="_blank" rel="noopener">
            サーバーに参加する
          </a>
          <a class="btn" href="https://discord.gg/gYYr4H6x" target="_blank" rel="noopener">
            Discordを開く
          </a>
        </div>
        <div style="margin-top:18px; color:var(--muted); font-size:13px;">
          招待リンク: <code>https://discord.gg/gYYr4H6x</code>
        </div>
      </section>
      <aside class="widget-wrap">
        <div class="widget-card">
          <div class="title">
            Discord 公式サーバー
          </div>
          <iframe class="discord-widget" src="https://discord.com/widget?id=1446121298953764930&theme=dark" allowtransparency="true" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts" referrerpolicy="no-referrer">
          </iframe>
          <div style="margin-top:10px; display:flex; gap:8px; justify-content:space-between; align-items:center;">
            <small style="color:var(--muted);">
              ウィジェットが表示されない場合、サーバーのウィジェット設定を確認してください。
            </small>
            <a class="btn" href="https://discord.gg/gYYr4H6x" target="_blank" rel="noopener">
              今すぐ参加
            </a>
          </div>
        </div>
      </aside>
    </main>
  </body>
</html>
